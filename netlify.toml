# Netlify config for the QGrid docs (demo/)
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  # demo/ depends on ../app-extension and ../ui, so the whole repo is checked out
  base = "demo"
  command = "npm ci && npm run build"
  publish = "dist/spa"
  # skip deploys when nothing the docs depend on has changed
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../ui/src ../ui/package.json ../app-extension ../netlify.toml"

[build.environment]
  # @quasar/app-vite v3 requires Node ^22.22 || ^24 || >= 26
  NODE_VERSION = "24"
  NPM_FLAGS = "--no-audit --no-fund"

# SPA fallback: the docs use vue-router "history" mode
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# hashed build assets can be cached forever
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
